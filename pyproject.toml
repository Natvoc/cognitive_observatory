[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-observatory"
version = "0.1.0"
description = "An open-source local laboratory for studying artificial observers, their internal models of reality, and the limits imposed by their cognitive architecture."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
cognitive-observatory = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "environments*", "agents*", "metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/"]
